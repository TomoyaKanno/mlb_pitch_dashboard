name: Build and deploy dashboard

on:
  # The build job is a required PR check. Do not path-filter this trigger:
  # a filtered-out required workflow remains "Expected" and blocks merging.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "config/dashboard.json"
      - "observable/**"
      - "pipeline/**"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh dashboard data
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build validated Pages artifact
    # A manual run may select any ref; only main may build an artifact eligible for Pages.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - name: Check out validated data
        uses: actions/checkout@v7
        with:
          ref: dashboard-data
          path: dashboard-data
          persist-credentials: false

      - name: Set build metadata
        run: |
          echo "DASHBOARD_CODE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DASHBOARD_DATA_SHA=$(git -C dashboard-data rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DASHBOARD_DATA_DIR=$GITHUB_WORKSPACE/dashboard-data" >> "$GITHUB_ENV"
          echo "DASHBOARD_SEASON=$(python -c 'import json; print(json.load(open("source/config/dashboard.json"))["season"])')" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/observable/package-lock.json

      - name: Install static-site dependencies
        working-directory: source/observable
        run: npm ci

      - name: Build from validated snapshot
        working-directory: source/observable
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
        run: npm run build

      - name: Verify browser payload
        working-directory: source
        run: python -m pipeline.verify_build --dist-dir observable/dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/observable/dist

  deploy:
    name: Deploy GitHub Pages
    # push is already restricted to main and workflow_run is branch-filtered above.
    # Keep the manual path explicit so a feature-branch dispatch cannot deploy.
    if: >-
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
