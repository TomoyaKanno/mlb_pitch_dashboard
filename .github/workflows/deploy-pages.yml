name: Build and deploy dashboard

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "config/dashboard.json"
      - "observable/**"
      - "pipeline/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "config/dashboard.json"
      - "observable/**"
      - "pipeline/**"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh dashboard data
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build validated Pages artifact
    # A manual run may select any ref; only main may build an artifact eligible for Pages.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - name: Check out validated data
        uses: actions/checkout@v7
        with:
          ref: dashboard-data
          path: dashboard-data
          persist-credentials: false

      - name: Set build metadata
        run: |
          echo "DASHBOARD_CODE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DASHBOARD_DATA_SHA=$(git -C dashboard-data rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DASHBOARD_DATA_DIR=$GITHUB_WORKSPACE/dashboard-data" >> "$GITHUB_ENV"
          echo "DASHBOARD_SEASON=$(python -c 'import json; print(json.load(open("source/config/dashboard.json"))["season"])')" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/observable/package-lock.json

      - name: Install static-site dependencies
        working-directory: source/observable
        run: npm ci

      - name: Build from validated snapshot
        working-directory: source/observable
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
        run: npm run build

      - name: Verify browser payload
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "source")
          from pipeline.export import reconcile_team_timeseries

          data_dir = Path("source/observable/dist/_file/data")
          dashboard_files = list(data_dir.glob("dashboard.*.json"))
          series_files = list(data_dir.glob("team-timeseries.*.json"))
          if len(dashboard_files) != 1:
              raise SystemExit(f"expected one dashboard payload, found {len(dashboard_files)}")
          if len(series_files) != 1:
              raise SystemExit(f"expected one team-timeseries payload, found {len(series_files)}")

          payload = json.loads(dashboard_files[0].read_text())
          series = json.loads(series_files[0].read_text())
          if payload["season"] != int(os.environ["DASHBOARD_SEASON"]):
              raise SystemExit("built the wrong season")
          if series["season"] != payload["season"]:
              raise SystemExit("team-timeseries season does not match dashboard")
          if len(payload["teams"]) != 30:
              raise SystemExit(f"expected 30 MLB teams, found {len(payload['teams'])}")
          recent_games = payload.get("recent_games")
          if not isinstance(recent_games, list) or len(recent_games) != len(payload["teams"]):
              raise SystemExit("dashboard missing one latest completed game per team")
          if {row["team_id"] for row in recent_games} != {row["team_id"] for row in payload["teams"]}:
              raise SystemExit("recent-game teams do not match season teams")
          if any(not row.get("pitchers") for row in recent_games):
              raise SystemExit("recent game has no pitcher workloads")
          next_games = payload.get("next_games")
          if not isinstance(next_games, list):
              raise SystemExit("next_games must be a list")
          if next_games:
              if len(next_games) != len(payload["teams"]):
                  raise SystemExit("dashboard missing one next game per team")
              if {row["team_id"] for row in next_games} != {row["team_id"] for row in payload["teams"]}:
                  raise SystemExit("next-game teams do not match season teams")
              for game in next_games:
                  if game["team_id"] == game["opponent_id"]:
                      raise SystemExit("next game has the same team and opponent")
                  pitcher_id = game.get("probable_pitcher_id")
                  pitcher_name = game.get("probable_pitcher_name")
                  if (pitcher_id is None) != (pitcher_name is None):
                      raise SystemExit("next game has incomplete probable-pitcher data")
          bullpen_usage = payload.get("bullpen_usage")
          if not isinstance(bullpen_usage, list) or len(bullpen_usage) != len(payload["teams"]):
              raise SystemExit("dashboard missing one bullpen-usage window per team")
          team_ids = {row["team_id"] for row in payload["teams"]}
          if {row["team_id"] for row in bullpen_usage} != team_ids:
              raise SystemExit("bullpen-usage teams do not match season teams")
          for usage in bullpen_usage:
              dates = usage.get("dates")
              if not isinstance(dates, list) or len(dates) != 14 or dates != sorted(set(dates)):
                  raise SystemExit("bullpen-usage window must contain 14 unique ordered dates")
              if usage.get("end_date") != dates[-1]:
                  raise SystemExit("bullpen-usage end date does not match its final date")
              pitchers = usage.get("pitchers")
              if not isinstance(pitchers, list):
                  raise SystemExit("bullpen-usage pitchers must be a list")
              if any(
                  len(pitcher.get("pitches", [])) != len(dates)
                  or any(not isinstance(value, int) or value < 0 for value in pitcher["pitches"])
                  for pitcher in pitchers
              ):
                  raise SystemExit("bullpen-usage pitch arrays do not match the date window")
          if payload["status"]["result"] == "failed":
              raise SystemExit("refusing to deploy a failed data snapshot")
          if payload["data_commit"] != os.environ["DASHBOARD_DATA_SHA"]:
              raise SystemExit("dashboard data revision does not match checked-out data")
          if series["data_commit"] != payload["data_commit"]:
              raise SystemExit("team-timeseries data revision does not match dashboard")
          if not isinstance(series.get("complete_games"), list):
              raise SystemExit("team-timeseries missing complete_games list")
          reconcile_team_timeseries(payload["teams"], series["points"])
          index_html = Path("source/observable/dist/index.html").read_text()
          if "_node/react@" in index_html:
              raise SystemExit("built dashboard contains a second React runtime")
          print(
              f"Validated {len(payload['teams'])} teams, {len(series['points'])} "
              f"team-day points, {len(series['complete_games'])} complete games, "
              f"{len(recent_games)} recent team games, {len(next_games)} next team games, "
              f"{len(bullpen_usage)} bullpen windows, "
              f"and {payload['status']['current_games']} current games"
          )
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/observable/dist

  deploy:
    name: Deploy GitHub Pages
    # push is already restricted to main and workflow_run is branch-filtered above.
    # Keep the manual path explicit so a feature-branch dispatch cannot deploy.
    if: >-
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
