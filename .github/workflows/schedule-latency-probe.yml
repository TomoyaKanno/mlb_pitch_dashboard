name: Probe GitHub schedule latency

on:
  schedule:
    # Temporary comparison point for the 09:17 UTC production refresh.
    # During the 2026 regular season, 08:17 UTC is 04:17 Eastern.
    - cron: "17 8 * 3-11 *"
  workflow_dispatch:

# This diagnostic does not check out source or write repository state.
permissions: {}

concurrency:
  group: schedule-latency-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Record scheduler delay
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Record dispatch timing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || 'manual' }}
        run: |
          runner_started_epoch="$(date -u +%s)"
          runner_started_utc="$(date -u --iso-8601=seconds)"
          runner_started_eastern="$(TZ=America/New_York date --iso-8601=seconds)"

          {
            echo "## GitHub schedule latency probe"
            echo "- Event: $EVENT_NAME"
            echo "- Trigger expression: \`$SCHEDULE_EXPRESSION\`"
            echo "- Runner started (UTC): $runner_started_utc"
            echo "- Runner started (Eastern): $runner_started_eastern"

            if [[ "$EVENT_NAME" == "schedule" ]]; then
              expected_epoch="$(date -u -d "$(date -u +%F) 08:17:00" +%s)"
              if (( expected_epoch > runner_started_epoch )); then
                expected_epoch="$((expected_epoch - 86400))"
              fi

              latency_seconds="$((runner_started_epoch - expected_epoch))"
              latency_hours="$((latency_seconds / 3600))"
              latency_minutes="$(((latency_seconds % 3600) / 60))"
              latency_remainder="$((latency_seconds % 60))"
              printf -v latency_hms "%02d:%02d:%02d" \
                "$latency_hours" "$latency_minutes" "$latency_remainder"

              echo "- Expected (UTC): $(date -u -d "@$expected_epoch" --iso-8601=seconds)"
              echo "- Expected (Eastern): $(TZ=America/New_York date -d "@$expected_epoch" --iso-8601=seconds)"
              echo "- Runner-start latency: $latency_hms ($latency_seconds seconds)"
            else
              echo "- Runner-start latency: not calculated for a manual run"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
